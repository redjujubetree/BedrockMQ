# Activate alongside sqlite or mysql, for example: --spring.profiles.active=sqlite,http-client
# Local loopback demo: the same example application receives the encrypted request.
bedrock.mq.http.client.enabled=true
bedrock.mq.http.clients.primary.address=http://localhost
bedrock.mq.http.clients.primary.port=9528
bedrock.mq.http.clients.primary.path=/bedrockmq-example/bedrock/v1/messages
bedrock.mq.http.clients.primary.encryption-key=${BEDROCKMQ_HTTP_KEY}
bedrock.mq.http.server.enabled=true
bedrock.mq.http.server.encryption-key=${BEDROCKMQ_HTTP_KEY}
